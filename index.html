    <div class="text-center mt-8 text-sm opacity-75" style="color: #4E56C0;">
     <p>ขอบคุณที่สละเวลาในการตอบแบบประเมิน</p>
     <p class="mt-1">ข้อมูลของท่านจะถูกเก็บเป็นความลับและนำไปพัฒนาคุณภาพการอบรมต่อไป</p>

  <script>
        const defaultConfig = {
            main_title: 'DATA - DRIVEN REHAB',
            subtitle: 'ยกระดับประสิทธิภาพทีมด้วยเทคโนโลจี และ AI'
        };

        const ratings = {
            q1: null, q2: null, q3: null, q4: null, q5: null,
            q6: null, q7: null, q8: null, q9: null
        };

        // Rating button click handler
        document.querySelectorAll('.rating-button').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const question = this.dataset.question;
                const value = this.dataset.value;
                
                // Remove selected class from all buttons in this question
                document.querySelectorAll(`[data-question="${question}"]`).forEach(btn => {
                    btn.classList.remove('selected');
                    btn.style.background = 'white';
                    btn.style.color = '#4E56C0';
                });
                
                // Add selected class to clicked button
                this.classList.add('selected');
                this.style.background = 'linear-gradient(135deg, #9B5DE0 0%, #D78FEE 100%)';
                this.style.color = 'white';
                
                // Store rating
                ratings[question] = parseInt(value);
            });
        });

        // Form submit handler
        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate all ratings
            const missingRatings = [];
            for (let i = 1; i <= 9; i++) {
                if (ratings[`q${i}`] === null) {
                    missingRatings.push(i);
                }
            }
            
            if (missingRatings.length > 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'กรุณาประเมินให้ครบถ้วน',
                    text: `กรุณาให้คะแนนคำถามข้อ: ${missingRatings.join(', ')}`,
                    confirmButtonColor: '#9B5DE0',
                    confirmButtonText: 'ตกลง'
                });
                return;
            }
            
            // Prepare data
            const formData = {
                timestamp: new Date().toISOString(),
                q1: ratings.q1,
                q2: ratings.q2,
                q2_example: document.getElementById('q2_example').value,
                q3: ratings.q3,
                q3_topics: document.getElementById('q3_topics').value,
                q4: ratings.q4,
                q5: ratings.q5,
                q6: ratings.q6,
                q7: ratings.q7,
                q8: ratings.q8,
                q9: ratings.q9,
                next_topic: document.getElementById('nextTopic').value,
                suggestions: document.getElementById('suggestions').value
            };
            
            // Show loading
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                showConfirmButton: false,
                willOpen: () => {
                    Swal.showLoading();
                }
            });
            
            try {
                // Send data using JSONP
                await sendDataViaJSONP(formData);
                
                // Show success message
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ!',
                    text: 'ขอบคุณสำหรับการตอบแบบประเมิน',
                    confirmButtonColor: '#9B5DE0',
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    // Reset form
                    document.getElementById('surveyForm').reset();
                    document.querySelectorAll('.rating-button').forEach(btn => {
                        btn.classList.remove('selected');
                        btn.style.background = 'white';
                        btn.style.color = '#4E56C0';
                    });
                    
                    // Reset ratings
                    Object.keys(ratings).forEach(key => ratings[key] = null);
                });
                
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#9B5DE0',
                    confirmButtonText: 'ตกลง'
                });
            }
        });

        // JSONP function to send data
        function sendDataViaJSONP(data) {
            return new Promise((resolve, reject) => {
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbw3ZN6Dro8JC8o7J4rTf-EHbDyPBgNZ-Lo5PfvUR_nmF1MfhjkhumjzieKSCrYK5bsl/exec';
                const callbackName = 'jsonpCallback_' + Date.now();
                
                window[callbackName] = function(response) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    
                    if (response.result === 'success') {
                        resolve(response);
                    } else {
                        reject(new Error(response.error || 'Unknown error'));
                    }
                };
                
                const script = document.createElement('script');
                const params = new URLSearchParams({
                    callback: callbackName,
                    ...data
                });
                
                script.src = `${scriptUrl}?${params.toString()}`;
                script.onerror = () => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error('Network error'));
                };
                
                document.body.appendChild(script);
            });
        }

        // Element SDK configuration
        async function onConfigChange(config) {
            const mainTitle = document.getElementById('main-title');
            const subtitle = document.getElementById('subtitle');
            
            if (mainTitle) {
                mainTitle.textContent = config.main_title || defaultConfig.main_title;
            }
            
            if (subtitle) {
                subtitle.textContent = config.subtitle || defaultConfig.subtitle;
            }
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ['main_title', config.main_title || defaultConfig.main_title],
                ['subtitle', config.subtitle || defaultConfig.subtitle]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig: defaultConfig,
                onConfigChange: onConfigChange,
                mapToCapabilities: mapToCapabilities,
                mapToEditPanelValues: mapToEditPanelValues
            });
        }
    </script>
